name: CI

# Un seul pipeline par push/PR — voir smartsms-backend (docs/devops.md) pour
# la même préoccupation côté GitLab (`templates/workflow.yml`, éviter un
# double déclenchement branche + MR pour le même commit). `concurrency`
# annule un run obsolète quand un nouveau push arrive sur la même branche.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-engine-strict
      - run: npm run lint

  # Avant `test`, pas après — voir smartsms-backend (docs/devops.md, issue
  # #132 de ce projet frère) : `tsc --noEmit` sur `tsconfig.json` (le job
  # `lint` le fait déjà) contrôle les types, mais `nest build` reste un
  # filet explicite et redondant par design contre le même scénario qui a
  # cassé leur `develop` deux jours — un mock partiel satisfaisant
  # `jest.Mocked<T>` sans que Jest (transpilation isolée, sans vérification
  # de types) ne le détecte. Une branche qui ne compile pas échoue ici,
  # avant que `test`/`e2e` ne tournent sur du code cassé.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-engine-strict
      - run: npm run build

  # Tests unitaires — repositories mockés (ADR-0003), aucune base de
  # données réelle nécessaire (voir docs/backend/testing.md du kit).
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-engine-strict
      - run: npm test

  # Service PostgreSQL éphémère — même principe que `.test-nestjs` côté
  # smartsms-backend (voir docs/devops.md de ce projet frère). `--passWithNoTests` :
  # aucun test e2e réel n'existe encore (voir docs/backend/testing.md du
  # kit — "monter un e2e avant que le parcours existe reviendrait à tester
  # un flux qui change encore à chaque itération") ; ce job devient
  # bloquant dès le premier `test/*.e2e-spec.ts` réel (MaLoyer-backend#8 et
  # suivants, voir le ticket "Tests e2e & lancement production").
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darmeuble_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/darmeuble_ci
      # Secrets non sensibles, dérivés du run CI — jamais réutilisés hors de
      # ce job. Même stratégie provisoire que smartsms-backend (JWT_SECRET
      # dérivé de CI_PIPELINE_ID/CI_COMMIT_SHA) en attendant un vrai secret
      # d'environnement de test.
      JWT_ACCESS_SECRET: ci-only-${{ github.run_id }}-${{ github.sha }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-engine-strict
      - run: npm run prisma:deploy
      - run: npm run test:e2e -- --passWithNoTests
